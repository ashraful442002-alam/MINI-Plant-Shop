<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MINI PLANT SHOP - Cart</title>

  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
  <link rel="stylesheet" href="style/style.css" />

  <style>
    /* Toast - fixed position, no layout interference */
    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(30px);
      background: #1a3d2b;
      color: #fff;
      padding: 12px 32px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 9999;
      box-shadow: 0 4px 18px rgba(40,90,67,0.35);
      letter-spacing: 0.5px;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    /* Empty cart message */
    #empty-cart-msg {
      display: none;
    }
  </style>
</head>

<body class="bg-[#285A43] min-h-screen flex flex-col md:flex-row">

  <!-- Left Sidebar -->
  <section class="w-full md:w-2/12 bg-[#285A43] md:min-h-screen">
    <nav>
      <h2 class="mx-5 my-6 font-bold text-2xl text-white">MINI PLANT SHOP</h2>
      <ul class="space-y-2">
        <li>
          <a href="home.html" class="block ml-2 p-3 text-white hover:bg-white hover:text-green-800 rounded-l-full flex items-center gap-3">
            <i class="fa-regular fa-house"></i> Home
          </a>
        </li>
        <li>
          <a href="delivery.html" class="block ml-2 p-3 text-white hover:bg-white hover:text-green-800 rounded-l-full flex items-center gap-3">
            <i class="fa-solid fa-truck-fast"></i> Delivery
          </a>
        </li>
        <li>
          <a href="catalog.html" class="block ml-2 p-3 text-white hover:bg-white hover:text-green-800 rounded-l-full flex items-center gap-3">
            <i class="fa-regular fa-rectangle-list"></i> Catalog
          </a>
        </li>
        <!-- Cart - active, with badge -->
        <li class="relative">
          <a href="cart.html" class="block ml-2 p-3 bg-white text-[#285A43] rounded-l-full flex items-center gap-3 font-semibold">
            <i class="fa-solid fa-cart-arrow-down"></i> Cart
            <span id="cart-badge"
              style="display:none; position:absolute; top:4px; right:10px; background:#ef4444; color:#fff; font-size:11px; font-weight:700; width:20px; height:20px; border-radius:50%; align-items:center; justify-content:center;">
              0
            </span>
          </a>
        </li>
      </ul>
    </nav>
  </section>

  <!-- Main Content -->
  <section class="w-full md:w-10/12 bg-white md:rounded-3xl md:mr-2 md:my-2 overflow-hidden flex flex-col">

    <!-- Top Search Bar -->
    <div class="flex items-center justify-between px-4 py-3">
      <label class="input rounded-full m-2 md:m-0 w-[75%] md:w-[80%] h-[35px] flex-1 max-w-md">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" placeholder="Search" />
      </label>
      <i class="fa-solid fa-user text-2xl mr-4"></i>
    </div>

    <!-- Page Title -->
    <div class="px-6 py-4">
      <h1 class="text-2xl font-bold text-[#285A43]">Checkout</h1>
    </div>

    <!-- Progress Steps -->
    <div class="px-6 pb-6">
      <div class="flex items-center gap-3 text-sm">
        <div class="flex items-center gap-2">
          <span class="w-6 h-6 rounded-full bg-green-600 text-white flex items-center justify-center text-xs font-bold">1</span>
          <span>Account</span>
        </div>
        <div class="flex-1 h-px bg-green-600"></div>
        <div class="flex items-center gap-2">
          <span class="w-6 h-6 rounded-full bg-green-600 text-white flex items-center justify-center text-xs font-bold">2</span>
          <span>Shipping</span>
        </div>
        <div class="flex-1 h-px bg-green-600"></div>
        <div class="flex items-center gap-2">
          <span class="w-6 h-6 rounded-full bg-green-600 text-white flex items-center justify-center text-xs font-bold">3</span>
          <span class="font-semibold text-green-700">Payment</span>
        </div>
      </div>
    </div>

    <div class="flex-1 p-6 md:p-8 overflow-auto">
      <div class="grid md:grid-cols-5 gap-8">

        <!-- Payment Details Form -->
        <div class="md:col-span-3">
          <h2 class="text-xl font-semibold mb-6">Payment Details</h2>

          <div class="space-y-6">
            <div>
              <label class="text-sm font-medium mb-2 block">Use saved card</label>
              <select class="select select-bordered w-full bg-green-50">
                <option>Mastercard ending 234</option>
              </select>
            </div>

            <div>
              <label class="text-sm font-medium mb-2 block">Name on card</label>
              <input type="text" value="John Smith" class="input input-bordered w-full bg-green-50" />
            </div>

            <div>
              <label class="text-sm font-medium mb-2 block">Card number</label>
              <input type="text" value="1234 5678 9012 3456" class="input input-bordered w-full bg-green-50" />
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="text-sm font-medium mb-2 block">Expiration</label>
                <div class="flex gap-3">
                  <input type="text" value="03" class="input input-bordered w-20 text-center bg-green-50" />
                  <span class="flex items-center">/</span>
                  <input type="text" value="24" class="input input-bordered w-20 text-center bg-green-50" />
                </div>
              </div>
              <div>
                <label class="text-sm font-medium mb-2 block">CVC</label>
                <input type="text" value="123" class="input input-bordered w-28 bg-green-50" />
              </div>
            </div>
          </div>

          <div class="mt-10 flex gap-4">
            <button id="cancel-btn" class="flex-1 btn btn-outline">
              Cancel Order
            </button>
            <button id="complete-order-btn"
                    class="flex-1 btn bg-[#285A43] text-white hover:bg-[#1f4634]">
              Complete Order
            </button>
          </div>
        </div>

        <!-- Order Summary (dynamic) -->
        <div class="md:col-span-2 bg-[#285A43] text-white rounded-3xl p-6 h-fit">
          <h3 class="text-lg font-semibold mb-5">Order Summary</h3>

          <!-- Dynamic items injected here by cart.js -->
          <div id="order-items" class="space-y-3">
            <!-- items rendered by JS -->
          </div>

          <!-- Empty cart message -->
          <p id="empty-cart-msg" class="text-green-300 text-sm text-center py-4">
            Your cart is empty. <a href="catalog.html" class="underline text-white">Browse plants →</a>
          </p>

          <div class="mt-8 space-y-3 text-sm">
            <div class="flex justify-between">
              <span>Sub total</span>
              <span id="subtotal">$0.00</span>
            </div>
            <div class="flex justify-between">
              <span>Tax</span>
              <span id="tax">$0.00</span>
            </div>
            <div class="flex justify-between">
              <span>Shipping</span>
              <span class="text-green-400">Free</span>
            </div>
          </div>

          <div class="border-t border-white/30 my-5"></div>

          <div class="flex justify-between text-lg font-semibold">
            <span>Total</span>
            <span id="total">$0.00</span>
          </div>
          <p id="item-count" class="text-xs text-green-300">0 items</p>

          <button id="discount-btn" class="mt-6 w-full btn bg-white text-[#285A43] hover:bg-green-100">
            Apply Discount Code
          </button>
        </div>

      </div>
    </div>
  </section>

  <!-- Toast Notification -->
  <div id="toast"> Order Confirmed!</div>

  <script src="js/cart.js"></script>
</body>
</html>
